[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "educational-research-skill"
version = "0.3.0"
description = "Traceable education-first research packs and a reusable Codex skill"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1", "reportlab>=4.2,<5", "pymupdf>=1.24,<2", "citeproc-py>=0.8,<1", "citeproc-py-styles>=0.1,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "build", "pyyaml>=6"]

[project.scripts]
educational-research = "educational_research.cli:main"

[tool.setuptools.packages.find]
include = ["educational_research*"]

[tool.setuptools.package-data]
educational_research = ["render/*.json"]

[tool.pytest.ini_options]
markers = ["live: opt-in network smoke checks"]
testpaths = ["tests"]

[tool.ruff]
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
