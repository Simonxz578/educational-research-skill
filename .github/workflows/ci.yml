name: Offline research-pack checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python scripts/check_public_files.py
      - run: python scripts/generate_examples.py --count 10 --output outputs/ci
      - run: python scripts/validate_research_pack.py outputs/ci

      - run: python scripts/generate_quality_example.py --output outputs/quality-ci
      - run: python scripts/validate_research_pack.py outputs/quality-ci
      - run: python scripts/generate_quality_example.py --count 20 --abstract-count 7 --output outputs/quality-20-ci
      - run: python scripts/validate_research_pack.py outputs/quality-20-ci
